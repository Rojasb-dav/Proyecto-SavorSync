# Connector/J only. The system truststore still serves outbound HTTPS.
spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${MYSQL_TRUSTSTORE_URL}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${MYSQL_TRUSTSTORE_PASSWORD}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.fallbackToSystemTrustStore=false
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.flyway.enabled=false
# Trust a forwarded chain only from ingress addresses verified by the operator.
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.internal-proxies=${RENDER_TRUSTED_PROXY_REGEX:(?!)}
