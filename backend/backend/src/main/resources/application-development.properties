# Entorno de desarrollo local. Las credenciales se inyectan desde el entorno.
server.address=127.0.0.1
spring.flyway.enabled=${APP_FLYWAY_ENABLED:true}
app.seed.moderator-enabled=${APP_SEED_MODERATOR_ENABLED:false}
app.seed.moderator-password=${APP_SEED_MODERATOR_PASSWORD:}
app.security.codes.max-per-hour=${APP_SECURITY_CODES_MAX_PER_HOUR:5}
app.security.codes.source-max-per-hour=${APP_SECURITY_CODES_SOURCE_MAX_PER_HOUR:100}
app.security.codes.window-minutes=60
app.security.codes.resend-seconds=60
