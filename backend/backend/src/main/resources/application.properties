spring.application.name=backend

# Configuración del servidor
server.port=${PORT:8080}
server.address=0.0.0.0
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

# Configuración de la Base de Datos (Variables de Entorno para Render / Aiven)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=${APP_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# JWT (Soportado mediante Variable de Entorno APP_JWT_SECRET)
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

# Configuración de Cloudinary (Variables de Entorno)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Configuración de Gmail SMTP (Variables de Entorno)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
